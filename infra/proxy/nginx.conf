# Local reverse proxy (development). Mirrors the production routing contract:
#   /api/*        -> API (Express)
#   /socket.io/*  -> API (Socket.IO, WebSocket upgrade)
#   /*            -> Web (Next.js)
# Same-origin routing means browser cookies are first-party and CORS is not needed for the main app.
# In production, TLS terminates at the managed load balancer / WAF; this file documents the contract.

worker_processes auto;
events { worker_connections 4096; }

http {
  server_tokens off;
  client_max_body_size 2m;           # raise per-route (e.g. uploads go direct to object storage via signed URLs)

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Multiple API replicas: Socket.IO HTTP long-polling fallback needs sticky routing.
  # ip_hash is fine locally; production uses load-balancer cookie stickiness (see docs/architecture/06-realtime-websockets.md).
  upstream api { ip_hash; server api:4000; }
  upstream web { server web:3000; }

  server {
    listen 8080;

    # Baseline headers. The API (helmet) and Next.js set route-specific headers including CSP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Strict-Transport-Security is set where TLS terminates (not on plain-HTTP localhost).

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;

    location /api/ {
      proxy_pass http://api;
      proxy_read_timeout 30s;
    }

    # Menu item photo upload: raw image body, max 5 MB (MENU_IMAGE_MAX_BYTES) plus headroom. Only this route.
    location ~ ^/api/v1/menu/items/[0-9a-fA-F-]{36}/image$ {
      client_max_body_size 6m;
      proxy_request_buffering on;
      proxy_pass http://api;
      proxy_read_timeout 60s;
    }

    location /socket.io/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 75s;
    }

    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
