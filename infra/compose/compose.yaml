# Local development stack. NOT a production or high-availability architecture.
#
# From the repository root:
#   cp .env.example .env                      # then edit local values
#   docker compose -f infra/compose/compose.yaml --env-file .env up -d               # postgres + redis only
#   docker compose -f infra/compose/compose.yaml --env-file .env --profile apps up   # + api, worker, web, proxy (once implemented)
#
# Ports are bound to 127.0.0.1 only. Never expose PostgreSQL or Redis publicly in any environment.
name: restaurant-platform

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      # Consumed by init/01-roles.sh to create least-privilege roles.
      DATABASE_MIGRATOR_USER: ${DATABASE_MIGRATOR_USER:?set in .env}
      DATABASE_MIGRATOR_PASSWORD: ${DATABASE_MIGRATOR_PASSWORD:?set in .env}
      DATABASE_APP_USER: ${DATABASE_APP_USER:?set in .env}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?set in .env}
      DATABASE_RELAY_USER: ${DATABASE_RELAY_USER:?set in .env}
      DATABASE_RELAY_PASSWORD: ${DATABASE_RELAY_PASSWORD:?set in .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command:
      ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [backend]
    restart: unless-stopped

  # ---- Application services (profile "apps"; images build once code exists) --------
  api:
    profiles: [apps]
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    init: true
    env_file: ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend, edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  worker:
    profiles: [apps]
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    init: true
    env_file: ../../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  web:
    profiles: [apps]
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    init: true
    environment:
      WEB_INTERNAL_API_URL: http://api:4000
    depends_on: [api]
    networks: [edge]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  proxy:
    profiles: [apps]
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [api, web]
    networks: [edge]

networks:
  # backend: data stores + services that need them. In deployed environments this maps to private subnets.
  backend: {}
  # edge: reverse proxy and HTTP-serving services.
  edge: {}

volumes:
  postgres-data: {}
  redis-data: {}
