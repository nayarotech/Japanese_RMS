# Continuous integration. No deployment, no credentials.
# Planned additions (Phase 1+, see docs/operations/README.md): PostgreSQL/Redis service containers for
# integration + cross-tenant security tests, image builds with Trivy scanning, SBOM, CodeQL, staging deploy.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: White-label brand leak check
        run: pnpm check:brand
        env:
          # Repository variable (Settings > Variables). Comma-separated terms that must never ship.
          BRAND_DENYLIST: ${{ vars.BRAND_DENYLIST }}

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Dependency audit (fail on high/critical)
        run: pnpm audit --audit-level=high
      - name: Secret scan (gitleaks, full history)
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git --redact --verbose /repo
